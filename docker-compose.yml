# CarMotoCare — ambiente completo com Docker.
# Arrancar:  docker compose up --build
# Site:      http://localhost
# RabbitMQ:  http://localhost:15672

# Definição comum aos serviços Laravel
# Sem "image:" de propósito: com o mesmo nome em todos os serviços, o primeiro "up --build" falhava com
# "image already exists". Cada serviço tem a sua etiqueta; o Docker partilha as camadas entre elas.
x-laravel: &laravel
  build:
    context: ./backend
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

x-db-env: &db-env
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${POSTGRES_DB}
  DB_USERNAME: ${POSTGRES_USER}
  DB_PASSWORD: ${POSTGRES_PASSWORD}

services:

  # ---------- Infraestrutura ----------
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro   # cria as bases de testes (só num volume novo)
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitdata:/var/lib/rabbitmq
      - ./infra/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    ports:
      - "127.0.0.1:1883:1883"     # MQTT (sem TLS, só para testes locais)
      - "127.0.0.1:15672:15672"   # consola de gestão
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    restart: unless-stopped
    depends_on:
      - eapi-web
    ports:
      - "${HTTP_PORT:-80}:80"

  # ---------- Experience API ----------
  eapi-web:
    <<: *laravel
    volumes:
      - ./backend/eapi-web:/app
      - eapi_web_vendor:/app/vendor   # dependências dentro do Docker (rápido no Windows)
    environment:
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-3600}
    ports:
      - "127.0.0.1:8080:8080"

  # ---------- System APIs ----------
  # Ambas as SAPIs migram para o mesmo schema (public). sapi-vehicles só arranca depois de
  # sapi-users estar saudável, porque vehicles.user_id tem FK para users (ver docs/data/data-model.md, D3).
  sapi-vehicles:
    <<: *laravel
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      sapi-users:
        condition: service_healthy
    volumes:
      - ./backend/sapi-vehicles:/app
      - sapi_vehicles_vendor:/app/vendor   # dependências dentro do Docker (rápido no Windows)
    environment:
      <<: *db-env
      PORT: 8081
      RUN_MIGRATIONS: "true"
    ports:
      - "127.0.0.1:8081:8081"

  sapi-users:
    <<: *laravel
    volumes:
      - ./backend/sapi-users:/app
      - sapi_users_vendor:/app/vendor   # dependências dentro do Docker (rápido no Windows)
    environment:
      <<: *db-env
      PORT: 8082
      RUN_MIGRATIONS: "true"
    ports:
      - "127.0.0.1:8082:8082"
    # O entrypoint corre as migrações antes de arrancar o servidor: "healthy" = tabela users criada.
    # A imagem não tem curl, por isso o teste usa PHP.
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost:8082/health') ? 0 : 1);"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 120s   # primeiro arranque: composer install dentro do contentor

  sapi-workshops:
    <<: *laravel
    volumes:
      - ./backend/sapi-workshops:/app
      - sapi_workshops_vendor:/app/vendor   # dependências dentro do Docker (rápido no Windows)
    environment:
      PORT: 8083
    ports:
      - "127.0.0.1:8083:8083"

  # ---------- Microserviços ----------
  ms-obd:
    <<: *laravel
    volumes:
      - ./backend/ms-obd:/app
      - ms_obd_vendor:/app/vendor   # dependências dentro do Docker (rápido no Windows)
    environment:
      PORT: 8084
    ports:
      - "127.0.0.1:8084:8084"

  ms-alerts:
    <<: *laravel
    volumes:
      - ./backend/ms-alerts:/app
      - ms_alerts_vendor:/app/vendor   # dependências dentro do Docker (rápido no Windows)
    environment:
      PORT: 8085
    ports:
      - "127.0.0.1:8085:8085"

  # ---------- Dispositivo OBD simulado ----------
  # Usa o mesmo Dockerfile dos serviços Laravel (PHP + Composer), mas sem o entrypoint Laravel (não há artisan nem .env.example).
  # Não arranca com "docker compose up" (perfil "simulator"). Arrancar com:  docker compose up obd-simulator
  obd-simulator:
    <<: *laravel
    profiles: ["simulator"]
    restart: "on-failure:5"
    depends_on:
      rabbitmq:
        condition: service_healthy
    entrypoint: ["sh", "-c", "[ -f vendor/autoload.php ] || composer install --no-interaction --prefer-dist --no-dev --no-progress || exit 1; exec php simulator.php"]
    volumes:
      - ./obd-simulator:/app
      - obd_simulator_vendor:/app/vendor   # dependências dentro do Docker (rápido no Windows)
    environment:
      DEVICE_ID: ${OBD_DEVICE_ID:-OBD-7F3A-0001}
      MQTT_HOST: rabbitmq
      MQTT_PORT: 1883
      MQTT_USERNAME: ${OBD_MQTT_USERNAME:-${RABBITMQ_DEFAULT_USER}}   # em produção: um utilizador por dispositivo
      MQTT_PASSWORD: ${OBD_MQTT_PASSWORD:-${RABBITMQ_DEFAULT_PASS}}
      START_KM: ${OBD_START_KM:-68420}
      INTERVAL_S: ${OBD_INTERVAL_S:-5}
      SPEED_FACTOR: ${OBD_SPEED_FACTOR:-1}
      MODE: ${OBD_MODE:-normal}

volumes:
  pgdata:
  rabbitdata:
  eapi_web_vendor:
  sapi_vehicles_vendor:
  sapi_users_vendor:
  sapi_workshops_vendor:
  ms_obd_vendor:
  ms_alerts_vendor:
  obd_simulator_vendor: