# Load balancer / reverse proxy (caixa "Nginx" da arquitetura).
# /      -> site React (ficheiros estáticos)
# /api/  -> EAPI Web (o prefixo /api é retirado, por isso os caminhos são iguais aos do OpenAPI)

upstream eapi_web {
    server eapi-web:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://eapi_web/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router: qualquer caminho que não seja ficheiro devolve o index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
