# Gerado a partir de "CarMotoCare - Endpoints por API (v7)" (19 nov. 2026).
openapi: 3.0.3
info:
  title: CarMotoCare — EAPI Web
  version: 7.0.0
  description: 'Experience API usada pela Web App (React, PWA). Autenticação por JWT (Bearer). Fala diretamente
    com as SAPIs. 29 operações.


    Os alertas novos chegam ao browser por WebSocket (reencaminhados do broker MQTT); o WebSocket não faz parte
    deste contrato REST.


    Itens marcados PRESSUPOSTO não estão fixados no PDF v7 e devem ser confirmados.'
servers:
- url: http://localhost:8080
  description: Atrás do Nginx (load balancer / reverse proxy)
security:
- bearerAuth: []
tags:
- name: Sistema
- name: Conta
- name: Veículos
- name: Prazos
- name: OBD
- name: Manutenção
- name: Inspeção
- name: Custos
- name: Peças
- name: Alertas
- name: Oficinas
paths:
  /health:
    get:
      tags:
      - Sistema
      summary: Estado da API
      operationId: getHealth
      responses:
        '200':
          description: API disponível
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
      security: []
  /users:
    post:
      tags:
      - Conta
      summary: Registar conta
      operationId: registerUser
      description: Cria a conta na SAPI Utilizadores (`POST /users`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Conta criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
      security: []
  /auth/tokens:
    post:
      tags:
      - Conta
      summary: Iniciar sessão (emite o JWT)
      operationId: createToken
      description: Verifica as credenciais na SAPI Utilizadores (`POST /authentications`) e emite o JWT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '201':
          description: Token emitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security: []
  /users/me:
    get:
      tags:
      - Conta
      summary: Ver a minha conta
      operationId: getMe
      responses:
        '200':
          description: Conta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags:
      - Conta
      summary: Alterar nome, e-mail e palavra-passe
      operationId: updateMe
      description: Para mudar e-mail ou palavra-passe exige a palavra-passe atual. O e-mail é único. Se a palavra-passe atual estiver errada a resposta é 400 com errors para o campo currentPassword (e não 401, que o frontend trata como sessão expirada).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Conta atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /vehicles:
    get:
      tags:
      - Veículos
      summary: Listar os meus veículos
      operationId: listVehicles
      description: Cada veículo traz `nextService` (peça com menos km em falta) e `openAlerts`. Filtro opcional
        por tipo (`type`) e paginação simples (`limit` e `offset`), reencaminhados para a SAPI Veículos. O total
        vem no cabeçalho `X-Total-Count`.
      parameters:
      - $ref: '#/components/parameters/VehicleTypeQ'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Veículos do utilizador (uma página)
          headers:
            X-Total-Count:
              description: Total de veículos que cumprem o filtro (sem paginação).
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vehicle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - Veículos
      summary: Adicionar veículo
      operationId: createVehicle
      description: >-
        Cria o veículo e o plano de peças por defeito (SAPI `POST /vehicles`) e, para cada data indicada
        (`iucValidUntil`, `insuranceValidUntil`, `inspectionValidUntil`), cria o prazo pendente (SAPI `POST /deadlines`).
        Os dois passos não são uma transação: se um prazo falhar, a EAPI apaga o veículo acabado de criar e devolve
        o erro, para não ficar um veículo a meio.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleCreate'
      responses:
        '201':
          description: Veículo criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /vehicles/{vehicleId}:
    get:
      tags:
      - Veículos
      summary: Ver veículo
      operationId: getVehicle
      parameters:
      - $ref: '#/components/parameters/VehicleId'
      responses:
        '200':
          description: Veículo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Veículos
      summary: Editar dados descritivos do veículo
      operationId: updateVehicle
      description: Sem km nem prazos. `firstRegistration` (AAAA-MM) substitui o ano.
      parameters:
      - $ref: '#/components/parameters/VehicleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleUpdate'
      responses:
        '200':
          description: Veículo atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Veículos
      summary: Remover veículo
      operationId: deleteVehicle
      description: Apaga também os dados associados (cascata).
      parameters:
      - $ref: '#/components/parameters/VehicleId'
      responses:
        '204':
          description: Removido
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /vehicles/{vehicleId}/deadlines:
    get:
      tags:
      - Prazos
      summary: Listar prazos legais (IUC, seguro e inspeção)
      operationId: listDeadlines
      parameters:
      - $ref: '#/components/parameters/VehicleId'
      responses:
        '200':
          description: Prazos do veículo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Deadline'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Prazos
      summary: Criar o prazo pendente de um tipo
      operationId: createDeadline
      description: Usado pelo formulário "Adicionar veículo". Um tipo só pode ter um prazo pendente.
      parameters:
      - $ref: '#/components/parameters/VehicleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeadlineCreate'
      responses:
        '201':
          description: Prazo criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deadline'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /vehicles/{vehicleId}/obd-device:
    put:
      tags:
      - OBD
      summary: Emparelhar (ou substituir) o dispositivo OBD
      operationId: pairObdDevice
      description: Se o veículo já tiver dispositivo, substitui-o. 409 se o `deviceId` já estiver associado a outro
        veículo.
      parameters:
      - $ref: '#/components/parameters/VehicleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObdDevicePair'
      responses:
        '200':
          description: Dispositivo emparelhado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObdDevice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags:
      - OBD
      summary: Ver o dispositivo OBD emparelhado
      operationId: getObdDevice
      parameters:
      - $ref: '#/components/parameters/VehicleId'
      responses:
        '200':
          description: Dispositivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObdDevice'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - OBD
      summary: Desemparelhar o dispositivo OBD
      operationId: unpairObdDevice
      parameters:
      - $ref: '#/components/parameters/VehicleId'
      responses:
        '204':
          description: Desemparelhado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /vehicles/{vehicleId}/obd-state:
    get:
      tags:
      - OBD
      summary: Último estado do veículo (leitura mais recente do OBD)
      operationId: getObdState
      description: Lê `GET /vehicles/{vehicleId}/readings/latest` da SAPI Veículos. Sem leituras devolve 200 com
        tudo nulo.
      parameters:
      - $ref: '#/components/parameters/VehicleId'
      responses:
        '200':
          description: Estado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObdState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /vehicles/{vehicleId}/maintenances:
    get:
      tags:
      - Manutenção
      summary: Histórico de manutenções
      operationId: listMaintenances
      description: Devolve tudo. Os filtros de período e tipo de intervenção são feitos no browser.
      parameters:
      - $ref: '#/components/parameters/VehicleId'
      responses:
        '200':
          description: Manutenções
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Maintenance'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Manutenção
      summary: Registar manutenção
      operationId: createMaintenance
      description: Atualiza as peças indicadas (último serviço = data e km da manutenção) e fecha os alertas dessas
        peças.
      parameters:
      - $ref: '#/components/parameters/VehicleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceCreate'
      responses:
        '201':
          description: Manutenção registada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /vehicles/{vehicleId}/maintenances/{maintenanceId}:
    get:
      tags:
      - Manutenção
      summary: Ver manutenção
      operationId: getMaintenance
      parameters:
      - $ref: '#/components/parameters/VehicleId'
      - $ref: '#/components/parameters/MaintenanceId'
      responses:
        '200':
          description: Manutenção
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Maintenance'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Manutenção
      summary: Corrigir custo e notas da manutenção
      operationId: updateMaintenance
      parameters:
      - $ref: '#/components/parameters/VehicleId'
      - $ref: '#/components/parameters/MaintenanceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceUpdate'
      responses:
        '200':
          description: Manutenção atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Maintenance'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /vehicles/{vehicleId}/inspections:
    get:
      tags:
      - Inspeção
      summary: Listar inspeções periódicas
      operationId: listInspections
      parameters:
      - $ref: '#/components/parameters/VehicleId'
      responses:
        '200':
          description: Inspeções
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Inspection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Inspeção
      summary: Registar inspeção periódica
      operationId: createInspection
      description: 'A km vem do veículo. Se aprovada: calcula a validade, fecha o alerta anterior e cria o prazo
        seguinte. Se reprovada: o prazo continua pendente.'
      parameters:
      - $ref: '#/components/parameters/VehicleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InspectionCreate'
      responses:
        '201':
          description: Inspeção registada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectionCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /vehicles/{vehicleId}/inspections/{inspectionId}:
    get:
      tags:
      - Inspeção
      summary: Ver os detalhes de uma inspeção
      operationId: getInspection
      description: Resultado, validade, valor pago e deficiências.
      parameters:
      - $ref: '#/components/parameters/VehicleId'
      - $ref: '#/components/parameters/InspectionId'
      responses:
        '200':
          description: Inspeção
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inspection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /vehicles/{vehicleId}/expenses:
    get:
      tags:
      - Custos
      summary: Despesas totais do veículo
      operationId: listExpenses
      description: 'Sem filtros no servidor (período no browser). Categorias: MANUTENCAO, INSPECAO, IUC, SEGURO.
        `km` só em manutenção.'
      parameters:
      - $ref: '#/components/parameters/VehicleId'
      responses:
        '200':
          description: Despesas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Expense'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Custos
      summary: Pagar IUC ou seguro
      operationId: payExpense
      description: Paga o prazo pendente desse tipo (ou cria-o primeiro), cria o seguinte (data = `validUntil`)
        e fecha o alerta. Na SAPI corresponde a `PATCH /vehicles/{vehicleId}/deadlines/{deadlineId}`.
      parameters:
      - $ref: '#/components/parameters/VehicleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseCreate'
      responses:
        '201':
          description: Pagamento registado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /vehicles/{vehicleId}/parts:
    get:
      tags:
      - Peças
      summary: Listar peças do veículo
      operationId: listParts
      description: Com intervalo, próximo valor, quanto falta e origem do intervalo. As peças vêm todas do plano
        por defeito; não se criam novas.
      parameters:
      - $ref: '#/components/parameters/VehicleId'
      responses:
        '200':
          description: Peças
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Part'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /vehicles/{vehicleId}/parts/{partId}:
    patch:
      tags:
      - Peças
      summary: Alterar intervalo e referência de uma peça
      operationId: updatePart
      parameters:
      - $ref: '#/components/parameters/VehicleId'
      - $ref: '#/components/parameters/PartId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartUpdate'
      responses:
        '200':
          description: Peça atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Part'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /alerts:
    get:
      tags:
      - Alertas
      summary: Listar alertas de todos os meus veículos
      operationId: listAlerts
      description: 'Sem filtros no servidor (tipo, período e veículo no browser). Não existe endpoint para fechar
        alertas: fecham-se ao registar custo de IUC/seguro, manutenção que atualize a peça, ou inspeção.'
      responses:
        '200':
          description: Alertas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Alert'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /workshops:
    get:
      tags:
      - Oficinas
      summary: Pesquisar oficinas próximas
      operationId: searchWorkshops
      description: Encaminha para a SAPI Oficinas (OpenStreetMap/Overpass).
      parameters:
      - $ref: '#/components/parameters/Lat'
      - $ref: '#/components/parameters/Lon'
      - $ref: '#/components/parameters/RadiusKm'
      - $ref: '#/components/parameters/WorkshopType'
      - $ref: '#/components/parameters/WorkshopQuery'
      responses:
        '200':
          description: Oficinas por distância
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workshop'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/BadGateway'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    VehicleTypeQ:
      name: type
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/VehicleType'
      description: Filtra os veículos por tipo (CARRO ou MOTO). Se omitido, devolve todos.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Número máximo de veículos por página.
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Número de veículos a saltar (início da página).
    VehicleId:
      name: vehicleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MaintenanceId:
      name: maintenanceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InspectionId:
      name: inspectionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PartId:
      name: partId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Lat:
      name: lat
      in: query
      required: true
      schema:
        type: number
        minimum: -90
        maximum: 90
      description: Latitude do centro da pesquisa.
    Lon:
      name: lon
      in: query
      required: true
      schema:
        type: number
        minimum: -180
        maximum: 180
      description: Longitude do centro da pesquisa.
    RadiusKm:
      name: radiusKm
      in: query
      schema:
        type: number
        default: 10
        minimum: 1
        maximum: 50
      description: Raio de pesquisa em km.
    WorkshopType:
      name: type
      in: query
      schema:
        type: string
        enum:
        - OFICINA
        - LOJA_PNEUS
      description: 'Filtro opcional (PRESSUPOSTO: o PDF só diz "pesquisar oficinas próximas").'
    WorkshopQuery:
      name: q
      in: query
      schema:
        type: string
      description: Texto livre (nome ou serviço). PRESSUPOSTO.
  responses:
    BadRequest:
      description: Pedido inválido (validação de campos).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Token ausente ou inválido.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Recurso não encontrado (ou não pertence ao utilizador).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflito com o estado atual do recurso.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadGateway:
      description: Serviço externo indisponível (Overpass).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Pedido inválido
        status:
          type: integer
          example: 400
        detail:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
            required:
            - field
            - message
          description: Erros de validação por campo (só em 400).
      required:
      - title
      - status
