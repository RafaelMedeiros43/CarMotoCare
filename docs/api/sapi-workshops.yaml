# Gerado a partir de "CarMotoCare - Endpoints por API (v7)" (19 nov. 2026).
openapi: 3.0.3
info:
  title: CarMotoCare — SAPI Oficinas
  version: 7.0.0
  description: System API interna. Pesquisa de oficinas próximas via OpenStreetMap/Overpass. 2 operações.
servers:
- url: http://sapi-workshops:8083
  description: Rede interna
tags:
- name: Sistema
- name: Oficinas
paths:
  /health:
    get:
      tags:
      - Sistema
      summary: Estado da API
      operationId: getHealth
      responses:
        '200':
          description: API disponível
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /workshops:
    get:
      tags:
      - Oficinas
      summary: Pesquisar oficinas próximas
      operationId: searchWorkshops
      description: Consulta a Overpass API (oficinas do OpenStreetMap) por HTTPS. Sem base de dados. Resultados
        ordenados por distância. 502 se a Overpass estiver indisponível.
      parameters:
      - $ref: '#/components/parameters/Lat'
      - $ref: '#/components/parameters/Lon'
      - $ref: '#/components/parameters/RadiusKm'
      - $ref: '#/components/parameters/WorkshopType'
      - $ref: '#/components/parameters/WorkshopQuery'
      responses:
        '200':
          description: Oficinas por distância
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workshop'
        '400':
          $ref: '#/components/responses/BadRequest'
        '502':
          $ref: '#/components/responses/BadGateway'
components:
  parameters:
    Lat:
      name: lat
      in: query
      required: true
      schema:
        type: number
        minimum: -90
        maximum: 90
    Lon:
      name: lon
      in: query
      required: true
      schema:
        type: number
        minimum: -180
        maximum: 180
    RadiusKm:
      name: radiusKm
      in: query
      schema:
        type: number
        default: 10
        minimum: 1
        maximum: 50
    WorkshopType:
      name: type
      in: query
      schema:
        type: string
        enum:
        - OFICINA
        - LOJA_PNEUS
      description: PRESSUPOSTO (o PDF só diz "pesquisar oficinas próximas").
    WorkshopQuery:
      name: q
      in: query
      schema:
        type: string
      description: Texto livre. PRESSUPOSTO.
  responses:
    BadRequest:
      description: Pedido inválido (validação de campos).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Token ausente ou inválido.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Recurso não encontrado (ou não pertence ao utilizador).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflito com o estado atual do recurso.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadGateway:
      description: Serviço externo indisponível (Overpass).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Pedido inválido
        status:
          type: integer
          example: 400
        detail:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
            required:
            - field
            - message
          description: Erros de validação por campo (só em 400).
      required:
      - title
      - status
      description: Erro no formato RFC 7807 (Problem Details).
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
          - UP
          example: UP
      required:
      - status
    Workshop:
      type: object
      properties:
        id:
          type: string
          example: node/123456
          description: Identificador OpenStreetMap.
        name:
          type: string
        type:
          type: string
          enum:
          - OFICINA
          - LOJA_PNEUS
        address:
          type: string
          nullable: true
        latitude:
          type: number
        longitude:
          type: number
        distanceKm:
          type: number
          example: 0.8
        services:
          type: array
          items:
            type: string
          nullable: true
      required:
      - id
      - name
      - type
      - latitude
      - longitude
      - distanceKm
